model:
  image_encoder:
    name: vit_base_patch16_224
    pretrained: true
    trainable_layers: all
    output_dim: 768

  text_encoder:
    name: xlm-roberta-base
    pretrained: true
    pooling: cls
    output_dim: 768

  projection_head:
    embedding_dim: 512
    hidden_dim: 1024
    dropout: 0.1
    l2_normalize: true

  temperature:
    init_value: 0.07
    learnable: true
