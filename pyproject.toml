[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multilingual-multimodal-retrieval-wit"
version = "0.1.0"
description = "Cross-lingual image–text retrieval using contrastive learning, transformer encoders, and scalable vector search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Krrish"},
]
keywords = ["multimodal", "retrieval", "CLIP", "contrastive-learning", "FAISS", "multilingual"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
